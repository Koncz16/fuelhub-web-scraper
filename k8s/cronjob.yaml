apiVersion: batch/v1
kind: CronJob
metadata:
  name: fuelhub-scraper
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: fuelhub-scraper
              image: ghcr.io/your-org/fuelhub-web-scraper:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: fuelhub-scraper-config
                - secretRef:
                    name: fuelhub-scraper-secret
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
