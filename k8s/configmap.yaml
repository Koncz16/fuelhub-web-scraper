apiVersion: v1
kind: ConfigMap
metadata:
  name: fuelhub-scraper-config
data:
  BACKEND_API_BASE_URL: "http://fuelhub-backend.fuelhub.svc.cluster.local"
  FUEL_BATCH_ENDPOINT: "/api/fuel/batch"
  SCRAPY_SPIDER: "peco"
  UPLOAD_BATCH_SIZE: "300"
  UPLOAD_TIMEOUT_SECONDS: "30"
  UPLOAD_MAX_RETRIES: "3"
  UPLOAD_RETRY_BACKOFF_SECONDS: "2"
  STATS_RECOMPUTE_ENABLED: "true"
  STATS_RECOMPUTE_ENDPOINT: "/api/statistics/recompute"
  STATS_RECOMPUTE_TIMEOUT_SECONDS: "30"
  STATS_RECOMPUTE_MAX_RETRIES: "3"
  STATS_RECOMPUTE_RETRY_BACKOFF_SECONDS: "2"
